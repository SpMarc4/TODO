<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="todo">
        <div class="todo-header">
            <h1>TODO List</h1>
        </div>
        <div class="todo-sidebar">
            <div class="menu-sidebar">
                <button class="btn-sidebar">TODOS</button>
                <button class="btn-sidebar">Today</button>
                <button class="btn-sidebar">Week</button>
                <button class="btn-sidebar">Notes</button>
            </div>
            <div class="projects-sidebar">
                <h3>Projects</h3>
                <div class="projects-sidebar-container">
                    <div class="project-container">
                        <button class="btn-project">Project 1</button>
                        <button class="btn-project-delete">X</button>
                    </div>
                    <div class="project-container">
                        <button class="btn-project">Project 1</button>
                        <button class="btn-project-delete">X</button>
                    </div>
                </div>
            </div>
            <div class="create-sidebar">
                <button class="btn-sidebar" id="create">Create</button>
            </div>
        </div>
        <section class="todo-main">
            <div class="todo-item-col">
                <div class="todo-item-col-info">
                    <div class="col-prior">
                    </div>
                    <input type="checkbox" class="col-check">
                    <div class="col-name">Todo 1</div>
                </div>
                <div class="todo-item-col-act">
                    <div class="col-date">
                        <p id="col-date">Date</p>
                    </div>
                    <button class="btn-col col-detail">?</button>
                    <button class="btn-col col-edit">Edit</button>
                    <button class="btn-col col-delete">X</button>
                </div>
            </div>
            <div class="notes-col" style="display: none">
                <div class="note-item-col">
                    <button class="btn-note-item-col">X</button>
                    <p class="dscr-note-item-col">
                        Esto es un nota de ejemplo que comprueba
                        como funcionan las notas
                    </p>
                </div>
            </div>
        </section>
        <footer class="todo-footer">Date:</footer>

    <div class="todo-background"></div>
    </div>
    <div class="modals"  style="display: none">
        <div class="modal-create">
            <button class="btn-modal">Project</button>
            <button class="btn-modal">TODO</button>
            <button class="btn-modal">Note</button>
            <button class="btn-modal-close">X</button>
        </div>
        <div class="modal-project-edit" style="display: none"></div>
        <div class="modal-note-edit"style="display: none"></div>
        <div class="modal-todo-edit"style="display: none"></div>
        <div class="modal-todo-info"style="display: none"></div>   
    </div>

</body>
</html>
